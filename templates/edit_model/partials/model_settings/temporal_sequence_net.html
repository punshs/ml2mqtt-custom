{% set current_type = model.params.modelParameters.model_type %}
{% set seq = model.params.modelParameters.model_parameters[current_type] if model.params.modelParameters.model_parameters[current_type] is defined else {} %}
<div class="form-group">
  <label>Epochs</label>
  <input type="number" name="epochs" value="{{ seq.epochs | default(60) }}">
</div>
<div class="form-group">
  <label>Batch Size</label>
  <input type="number" name="batchSize" value="{{ seq.batch_size | default(32) }}">
</div>
<div class="form-group">
  <label>Hidden Dimension / Channels</label>
  <input type="number" name="hiddenDim" value="{{ seq.hidden_dim | default(64) }}">
</div>

<script>
async function saveClassifierSettings() {
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;

  const formData = new FormData();
  formData.append("modelType", "{{ current_type }}");

  const fields = ["epochs", "batchSize", "hiddenDim"];

  for (const field of fields) {
    const el = document.querySelector(`[name="${field}"]`);
    if (!el || !el.value) {
      showToast(`Invalid value for ${field}`, true);
      saveBtn.disabled = false;
      return;
    }
    formData.append(field, el.value);
  }

  try {
    showToast("Saving...", false, true);

    const response = await fetch("{{ url_for('model.updateModelSettings', modelName=model.name) }}", {
      method: "POST",
      body: formData
    });

    if (response.ok) {
      localStorage.setItem("tuningComplete", "true");
      window.location.reload();
    } else {
      showToast("Failed to save settings.", true);
    }
  } catch (err) {
    showToast("Server error during save.", true);
  } finally {
    saveBtn.disabled = false;
  }
}
</script>
